controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    servo_joints:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters: {}

servo_joints:
  ros__parameters:
    joints:
      - joint_0
      - joint_1
      - joint_2
      - joint_3
